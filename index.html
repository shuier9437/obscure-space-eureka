<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跳转中</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Microsoft Yahei", sans-serif;
            background: #fff;
        }
        .tip {
            padding: 24px 32px;
            border: 2px dashed #ff4444;
            border-radius: 12px;
            background: #fff5f5;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #ff4444;
        }
    </style>
</head>
<body>
    <div id="loading">正在跳转...</div>

    <script>
        // 纯前端工具函数，浏览器本地执行，和后端无关
        function getQuery(name) {
            return new URLSearchParams(location.search).get(name);
        }

        function b64Decode(str) {
            try {
                str = str.replace(/-/g, '+').replace(/_/g, '/');
                while (str.length % 4) str += '=';
                return decodeURIComponent(atob(str));
            } catch (e) {
                return null;
            }
        }

        // 主逻辑：纯前端执行，GitHub 只负责发文件
        (function() {
            const c = getQuery('c');
            const loading = document.getElementById('loading');

            // 1. 无参数 → 直接显示提示
            if (!c) {
                document.body.innerHTML = '<div class="tip">老傻子想偷我接口 找你爹来买TG@huahai520ovo</div>';
                return;
            }

            // 2. 解码参数
            const url = b64Decode(c);
            if (!url) {
                document.body.innerHTML = '<div class="tip">链接解析失败</div>';
                return;
            }

            // 3. 直接跳转（纯前端跳转，无后端）
            console.log('跳转目标:', url);
            location.href = url;

            // 4. 2秒兜底，绝对不卡死
            setTimeout(() => {
                if (document.getElementById('loading')) {
                    document.body.innerHTML = '<div class="tip">跳转超时，请重试</div>';
                }
            }, 2000);
        })();
    </script>
</body>
</html>
