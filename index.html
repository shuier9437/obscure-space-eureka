<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加载中</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#fff;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;font-size:16px;color:#333;}
</style>
</head>
<body>
<div id="text">页面加载中...</div>

<script>
// 取参数
function getQuery(name) {
  return new URLSearchParams(location.search).get(name);
}

// Base64 解码（兼容链接）
function b64Decode(str) {
  try {
    str = str.replace(/-/g, '+').replace(/_/g, '/');
    while (str.length % 4) str += '=';
    return decodeURIComponent(atob(str));
  } catch (e) {
    return null;
  }
}

// 主逻辑
const c = getQuery('c');
if (!c) {
  document.body.innerHTML = "请使用正确链接访问";
} else {
  const url = b64Decode(c);
  if (url) {
    location.href = url;
  } else {
    document.body.innerHTML = "链接解析失败";
  }
}
</script>
</body>
</html>
