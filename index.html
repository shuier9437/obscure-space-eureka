<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>页面加载中...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
            background: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft Yahei", sans-serif;
        }
        /* 加载动画（极简不卡顿） */
        .loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            z-index: 9999;
            transition: opacity 0.2s ease;
        }
        .loading-text {
            font-size: 16px;
            color: #666;
        }
        /* 目标iframe（全屏无卡顿） */
        #targetFrame {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            display: none;
            z-index: 10;
        }
        /* 提示弹窗（偷接口/无参数提示） */
        .tip-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 24px 32px;
            border: 2px dashed #ff4444;
            border-radius: 16px;
            background: #fff5f5;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #ff4444;
            z-index: 99999;
            line-height: 1.6;
        }
        /* PC拦截提示 */
        .pc-tip {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            font-size: 18px;
            color: #333;
            z-index: 99999;
        }
    </style>
    <!-- 轻量化防调试（不卡顿版，无死循环） -->
    <script>
        // 极简防F12，不占用CPU，不卡顿
        (function() {
            // 禁用右键
            document.addEventListener('contextmenu', e => e.preventDefault());
            // 禁用F12、Ctrl+Shift+I等调试快捷键
            document.addEventListener('keydown', e => {
                if (
                    e.key === 'F12' || 
                    (e.ctrlKey && e.shiftKey && e.key === 'I') ||
                    (e.ctrlKey && e.shiftKey && e.key === 'J') ||
                    (e.ctrlKey && e.key === 'U')
                ) {
                    e.preventDefault();
                    return false;
                }
            });
            // 轻量化控制台检测，无死循环
            let devtools = /./;
            devtools.toString = function() {
                throw new Error('DevTools detected');
            };
            console.log('%c', devtools);
        })();
    </script>
</head>
<body>
    <!-- 加载动画 -->
    <div class="loading" id="loading">
        <div class="loading-text">页面加载中...</div>
    </div>

    <!-- 目标跳转iframe -->
    <iframe id="targetFrame" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-top-navigation"></iframe>

    <script>
        // ==============================================
        // 工具函数（轻量化，无冗余，不卡顿）
        // ==============================================
        /**
         * 获取URL参数（原生API，性能最优）
         * @param {string} name 参数名
         * @returns {string|null} 参数值
         */
        const getQueryParam = (name) => new URLSearchParams(window.location.search).get(name);

        /**
         * Base64解码（处理URL安全的Base64）
         * @param {string} str Base64编码的字符串
         * @returns {string|null} 解码后的字符串
         */
        const base64Decode = (str) => {
            try {
                // 处理URL安全的Base64（将-替换为+，_替换为/）
                str = str.replace(/-/g, '+').replace(/_/g, '/');
                // 补全Base64填充字符=
                while (str.length % 4) str += '=';
                return decodeURIComponent(atob(str));
            } catch (e) {
                console.error('[防红系统] Base64解码失败：', e);
                return null;
            }
        };

        /**
         * 域名白名单校验（可自定义，轻量匹配）
         * @param {string} url 目标URL
         * @returns {boolean} 是否允许
         */
        const isAllowed = (url) => {
            // 👇 在这里修改你允许的域名白名单
            const allowedDomains = [
                'baidu.com', 'qq.com', 'weixin.qq.com', 'zhihu.com',
                'jialian.post-jppost.com', '
huahai.post-jppost.com', 'bilibili.com', 'baidu.cn'
            ];
            try {
                const urlObj = new URL(url);
                return allowedDomains.some(domain => urlObj.hostname.endsWith(domain));
            } catch (e) {
                return false;
            }
        };

        /**
         * 设备检测（PC/移动端，轻量UA判断）
         * @returns {boolean} 是否为PC端
         */
        const isPC = () => !/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // ==============================================
        // 主逻辑（异步执行，不阻塞页面渲染）
        // ==============================================
        (function() {
            const loading = document.getElementById('loading');
            const frame = document.getElementById('targetFrame');

            // 1. PC端拦截（不需要就删除这段）
            if (isPC()) {
                loading.remove();
                document.body.innerHTML = '<div class="pc-tip">请在手机端访问</div>';
                return;
            }

            // 2. 获取?c=参数并进行Base64解码（核心）
            const encodedUrl = getQueryParam('c');
            console.log('[防红系统] 编码后的链接：', encodedUrl);
            
            if (!encodedUrl) {
                loading.remove();
                document.body.innerHTML = '<div class="tip-box">参数错误，无法解析链接</div>';
                return;
            }

            const targetUrl = base64Decode(encodedUrl);
            if (!targetUrl) {
                loading.remove();
                document.body.innerHTML = '<div class="tip-box">链接解码失败，请检查参数</div>';
                return;
            }
            console.log('[防红系统] 解码后的目标链接：', targetUrl);

            // 3. 非法URL → 显示偷接口提示
            if (!isAllowed(targetUrl)) {
                loading.remove();
                // 👇 在这里修改你的提示文案
                document.body.innerHTML = '<div class="tip-box">老傻子想偷我接口 找你爹来买TG@huahai520ovo</div>';
                return;
            }

            // 4. 加载目标iframe（懒加载，不卡顿）
            frame.src = targetUrl;
            frame.onload = () => {
                // 平滑隐藏加载动画，无卡顿
                loading.style.opacity = '0';
                setTimeout(() => loading.remove(), 200);
                frame.style.display = 'block';
            };

            // 5. 加载超时兜底（3秒，避免页面假死）
            setTimeout(() => {
                if (frame.style.display === 'none') {
                    loading.remove();
                    document.body.innerHTML = '<div class="tip-box">加载超时，请检查链接</div>';
                }
            }, 3000);
        })();
    </script>
</body>
</html>
